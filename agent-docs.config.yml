url: https://docs.xquik.com
# content-start-position stays disabled until the 50-page afdocs sample starts
# main content before generated Mintlify navigation on every sampled page.
# llms-txt-directive-html stays enabled even when it warns on buried positions:
# samples confirm directives exist, but generated Mintlify navigation can push
# page-body content past 50% on API pages. Treat that warning as generated HTML
# layout risk, not missing page snippets.
checks:
  - llms-txt-exists
  - llms-txt-valid
  - llms-txt-size
  - llms-txt-links-resolve
  - llms-txt-links-markdown
  - llms-txt-directive-html
  - llms-txt-directive-md
  - markdown-url-support
  - content-negotiation
  - rendering-strategy
  - page-size-html
  - page-size-markdown
  - tabbed-content-serialization
  - section-header-quality
  - markdown-code-fence-validity
  - http-status-codes
  - redirect-behavior
  - llms-txt-coverage
  - markdown-content-parity
  - cache-header-hygiene
  - auth-gate-detection
  - auth-alternative-access
options:
  maxLinksToTest: 50
  samplingStrategy: deterministic
