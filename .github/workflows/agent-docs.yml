name: Check agent-friendly docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  agent-docs-check:
    name: Docs, Security & Licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up npm
        run: |
          corepack enable npm
          npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check dependency integrity and licenses
        run: npm run check:dependencies

      - name: Run agent-friendly docs checks
        run: npm run test:agent-docs

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check links
        run: npm run docs:links

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Check repository licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
